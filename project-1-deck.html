<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P1- Tanya Arora</title>
  <link rel="icon" type="image/png" sizes="625x625" href="./favicon-white.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --midnight: #174A7E;
    --cream: #FFBF00;
    --slate: #7A8FA6;
    --bg: #FFFDF5;
    --bg-alt: #7A8FA6;
    --surface: #ffffff;
    --text: #23364a;
    --heading: #174A7E;
    --muted: #7A8FA6;
    --accent: #174A7E;
    --accent-soft: #205fa3;
    --line: #f0e3b8;
    --shadow: 0 10px 30px rgba(23,74,126,0.08);
  }
  html { overflow-x: hidden; }
  body { font-family: -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; width: 100%; }
  
  .deck-container { position: relative; width: 100%; height: 100vh; display: flex; flex-direction: column; }
  .slides-wrapper { position: relative; flex: 1; overflow: hidden; background: var(--bg); padding-top: 100px; padding-bottom: 20px; }
  .slide { position: absolute; inset: 0; display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.5s; }
  .slide.active { display: flex; opacity: 1; }
  .slide img { max-width: 92%; max-height: 88%; object-fit: contain; }
  
  .nav-arrows { position: absolute; top: 50%; transform: translateY(-50%); width: 100%; display: flex; justify-content: space-between; padding: 0 20px; z-index: 10; pointer-events: none; }
  .arrow-btn { pointer-events: all; width: 60px; height: 60px; border-radius: 50%; background: var(--midnight); color: #fff; border: none; cursor: pointer; font-size: 1.8rem; display: flex; align-items: center; justify-content: center; transition: background 0.2s; box-shadow: var(--shadow); }
  .arrow-btn:hover { background: var(--accent-soft); }
  
  .slide-counter { position: absolute; top: 20px; right: 30px; font-size: 1.2rem; color: var(--midnight); font-weight: 600; z-index: 10; }
  
  .thumbnail-strip { height: 100px; background: var(--surface); border-top: 1px solid var(--line); overflow-x: auto; display: flex; gap: 8px; padding: 8px; align-items: center; }
  .thumbnail { width: 85px; height: 85px; border-radius: 6px; border: 2px solid var(--line); cursor: pointer; overflow: hidden; flex-shrink: 0; transition: all 0.2s; }
  .thumbnail img { width: 100%; height: 100%; object-fit: cover; }
  .thumbnail:hover { border-color: var(--midnight); transform: scale(1.05); }
  .thumbnail.active { border-color: var(--midnight); box-shadow: 0 4px 12px rgba(23,74,126,0.3); }
  
  @media (max-width: 640px) {
    .arrow-btn { width: 45px; height: 45px; font-size: 1.3rem; }
    .slide-counter { font-size: 1rem; top: 15px; right: 20px; }
    .slide img { max-width: 95%; max-height: 85%; }
    .thumbnail-strip { height: 80px; }
    .thumbnail { width: 70px; height: 70px; }
  }
</style>
</head>
<body>
  <div class="deck-container">
  <div style="position: absolute; top: 10px; left: 20px; z-index: 20;">
  <a href="projects-gallery.html" style="display: inline-block; padding: 10px 18px; background: var(--midnight); color: #ffffff; border-radius: 6px; font-weight: 600; font-size: 0.85rem; transition: background 0.2s; cursor: pointer; text-decoration: none;">
    ← Back to Projects
  </a>
</div>  
    <div class="slides-wrapper">
      <div class="slide-counter"><span id="current">1</span> / <span id="total">13</span></div>
      
      <div class="slide active">
        <img src="Project1/Slide1.JPG" alt="Slide 1">
      </div>
      <div class="slide">
        <img src="Project1/Slide2.JPG" alt="Slide 2">
      </div>
      <div class="slide">
        <img src="Project1/Slide3.JPG" alt="Slide 3">
      </div>
      <div class="slide">
        <img src="Project1/Slide4.JPG" alt="Slide 4">
      </div>
      <div class="slide">
        <img src="Project1/Slide5.JPG" alt="Slide 5">
      </div>
      <div class="slide">
        <img src="Project1/Slide6.JPG" alt="Slide 6">
      </div>
      <div class="slide">
        <img src="Project1/Slide7.JPG" alt="Slide 7">
      </div>
      <div class="slide">
        <img src="Project1/Slide8.JPG" alt="Slide 8">
      </div>
      <div class="slide">
        <img src="Project1/Slide9.JPG" alt="Slide 9">
      </div>
      <div class="slide">
        <img src="Project1/Slide10.JPG" alt="Slide 10">
      </div>
      <div class="slide">
        <img src="Project1/Slide11.JPG" alt="Slide 11">
      </div>
      <div class="slide">
        <img src="Project1/Slide12.JPG" alt="Slide 12">
      </div>
      <div class="slide">
        <img src="Project1/Slide13.JPG" alt="Slide 13">
      </div>
      
      <div class="nav-arrows">
        <button class="arrow-btn" onclick="previousSlide()"><i class="fas fa-chevron-left"></i></button>
        <button class="arrow-btn" onclick="nextSlide()"><i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
    
    <div class="thumbnail-strip" id="thumbnailStrip"></div>
  </div>

  <script>
    const slides = document.querySelectorAll('.slide');
    const totalSlides = slides.length;
    let currentSlide = 0;

    // Initialize thumbnails
    function initThumbnails() {
      const strip = document.getElementById('thumbnailStrip');
      for (let i = 0; i < totalSlides; i++) {
        const thumb = document.createElement('div');
        thumb.className = 'thumbnail' + (i === 0 ? ' active' : '');
        thumb.innerHTML = `<img src="Project1/Slide${i + 1}.JPG" alt="Slide ${i + 1}">`;
        thumb.onclick = () => goToSlide(i);
        strip.appendChild(thumb);
      }
      document.getElementById('total').textContent = totalSlides;
    }

    function showSlide(n) {
      slides[currentSlide].classList.remove('active');
      document.querySelectorAll('.thumbnail')[currentSlide].classList.remove('active');
      
      currentSlide = (n + totalSlides) % totalSlides;
      
      slides[currentSlide].classList.add('active');
      document.querySelectorAll('.thumbnail')[currentSlide].classList.add('active');
      document.getElementById('current').textContent = currentSlide + 1;
    }

    function nextSlide() {
      showSlide(currentSlide + 1);
    }

    function previousSlide() {
      showSlide(currentSlide - 1);
    }

    function goToSlide(n) {
      showSlide(n);
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') previousSlide();
    });

    // Initialize
    initThumbnails();
  </script>
</body>
</html>
