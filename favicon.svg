  <!-- Geometric "TA" Monogram -->
  <g stroke-linecap="square" stroke-linejoin="miter">
    <!-- Slate Accent Shadow Lines -->
    <path d="M 120 180 H 300 M 180 180 V 380 M 230 380 L 330 180 L 430 380 M 260 320 H 400" 
          stroke="#7A8FA6" stroke-width="24" fill="none"/>
    
